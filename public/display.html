<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown display</title>
<link rel="stylesheet" href="/preview.css">
<style>
:root { --amber: #ffb020; --orange: #ff7a1a; --red: #ff5a52; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; align-items: center; justify-content: center;
  background: #000; color: var(--c, #fff); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

/* Timer */
#clock {
  font-size: min(30vw, 70vh); font-weight: 700; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
#clock.long { font-size: min(20vw, 60vh); }
#clock.neg { font-size: min(26vw, 70vh); } /* the minus sign needs room */
#clock.neg.long { font-size: min(18vw, 60vh); }
body[data-state="amber"] { --c: var(--amber); }
body[data-state="orange"] { --c: var(--orange); } /* the last minute */
body[data-state="red"] { --c: var(--red); } /* zero and below, steady */

/* Flash (2 times at 5 minutes left, 3 times at half time and at zero, 5 times every 5 minutes below zero): the screen flashes white, 0.6s each, then the timer carries on as normal.
   --n, the number of flashes, is set from the script. */
body.flash { animation: half-flash .6s var(--n, 3); }
@keyframes half-flash {
  0%, 49.9% { background: #fff; color: #000; }
  50%, 100% { background: #000; color: var(--c, #fff); }
}
@media (prefers-reduced-motion: reduce) { /* no full-screen flashing: the clock dims instead */
  body.flash { animation: none; }
  body.flash #clock { animation: half-pulse 1.2s var(--n, 3); }
}
@keyframes half-pulse { 50% { opacity: .15; } }

/* Splash: the church logo, centered on white (the logo's own background), with optional text underneath. Nothing animates except the text fade-in and long-text scrolling. */
body[data-mode="splash"] #clock, body[data-mode="timer"] #splash { display: none; }
#splash {
  position: fixed; inset: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2vh; background: #fff;
}
#splashLogo { display: block; flex: 0 1 auto; min-height: 0; height: min(66vh, 66vw); aspect-ratio: 1; max-width: 100%; object-fit: contain; }
#splashText {
  position: relative; flex: none; color: #115638; font-size: calc(min(8vw, 13vh) * var(--k, 1)); font-weight: 700; letter-spacing: .02em; line-height: 1.15;
  animation: rise 2.4s ease-out both;
}
#splashText[data-text=""] { display: none; } /* no text, no gap: the logo stays centered */
#splash:has(#splashText:not([data-text=""])) { gap: 3vh; }
#splash:has(#splashText:not([data-text=""])) #splashLogo { height: min(16vh, 16vw); } /* small logo when text is showing */
@keyframes rise { from { opacity: 0; transform: translateY(1.5vh); } }

#hint { position: fixed; bottom: 4vh; left: 0; right: 0; margin: 0; text-align: center; font-size: 1rem; color: #8a93a0; }
body[data-mode="splash"] #hint { color: #5b6470; }
body.fs { cursor: none; }
body.fs #hint { display: none; }
</style>
</head>
<body data-state="" data-mode="splash">

<div id="splash" aria-hidden="true">
  <img id="splashLogo" src="/splash-logo.png" alt="">
  <div id="splashText" class="st"><div class="st-track"><span class="st-item"></span></div></div>
</div>
<div id="clock">00:00</div>
<p id="hint">Click here to send the display to the extension screen</p>

<script src="/preview.js"></script>
<script>
const channel = new BroadcastChannel("countdown-timer");
const clock = document.getElementById("clock");
const hint = document.getElementById("hint");
const splashText = document.getElementById("splashText");
SplashText.attach(splashText);
let state = { running: false, endAt: 0, remaining: 0, total: 0, splash: true, text: "" };

let prevMs = null; // the time at the last redraw, used to spot the half-time moment
function draw() {
  document.body.dataset.mode = state.splash ? "splash" : "timer";
  const label = state.text || "";
  SplashText.set(splashText, label);
  document.documentElement.style.setProperty("--k", (state.size || 100) / 100);
  if (state.splash) { prevMs = null; return; } // no flash for a moment nobody saw
  const ms = state.running ? state.endAt - Date.now() : state.remaining; // goes below zero once the time is up
  TimerFmt.show(clock, ms);
  document.body.dataset.state = TimerFmt.state(ms, state.total);
  const flashes = Flash.count(prevMs, ms, state.total, state.running);
  if (flashes) Flash.play(document.body, flashes);
  prevMs = ms;
}

channel.onmessage = e => {
  if (e.data === "close-display") { window.close(); return; }
  if (e.data && typeof e.data === "object" && !e.data.type) { state = e.data; draw(); }
};
channel.postMessage("hello"); // ask the control page for the current state
setInterval(draw, 200);
draw();

// Heartbeat so the control page (and phones) can tell the display is open and whether it is fullscreen.
const beat = () => channel.postMessage({ type: "alive", fs: !!document.fullscreenElement });
setInterval(beat, 2000);
beat();
window.addEventListener("pagehide", () => channel.postMessage({ type: "bye" }));

// One click on the main screen sends this window, fullscreen, to the extension screen.
async function sendToExtension() {
  if (document.fullscreenElement) return;
  try {
    const details = await window.getScreenDetails();
    const target = details.screens.find(sc => sc !== details.currentScreen);
    if (!target) { hint.textContent = "No second screen found. Check the display settings, then click here."; return; }
    await document.documentElement.requestFullscreen({ screen: target });
  } catch (e) {
    hint.textContent = "Couldn't reach the extension screen. Allow window management for this site, then click here again.";
  }
}
document.addEventListener("click", sendToExtension);
document.addEventListener("fullscreenchange", () => {
  document.body.classList.toggle("fs", !!document.fullscreenElement);
  beat();
});
</script>
</body>
</html>
