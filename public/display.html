<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown display</title>
<style>
:root { --warn: #ffb020; --danger: #ff5a52; --slow: 1; }
@media (prefers-reduced-motion: reduce) { :root { --slow: 3; } } /* slower, not frozen */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; align-items: center; justify-content: center;
  background: #000; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

/* Timer */
#clock {
  font-size: min(30vw, 70vh); font-weight: 700; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
#clock.long { font-size: min(20vw, 60vh); }
body[data-state="warn"] { color: var(--warn); }
body[data-state="danger"], body[data-state="done"] { color: var(--danger); }
body[data-state="done"] #clock { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: .15; } }
@media (prefers-reduced-motion: reduce) { body[data-state="done"] #clock { animation: none; } }

/* Splash: slow drifting glows over a deep navy sky. Only transforms are animated, so it stays light on the GPU. */
body[data-mode="splash"] #clock, body[data-mode="timer"] #splash { display: none; }
#splash {
  position: fixed; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(165deg, #060a15 0%, #0c1a2d 100%);
}
.glow { position: absolute; width: 85vmax; height: 85vmax; border-radius: 50%; will-change: transform; }
.g1 { left: -30vmax; top: -35vmax; background: radial-gradient(circle, rgba(236,184,108,.50) 0%, transparent 62%);
      animation: drift-a calc(43s * var(--slow)) ease-in-out infinite alternate; }
.g2 { right: -35vmax; bottom: -40vmax; background: radial-gradient(circle, rgba(40,150,160,.50) 0%, transparent 62%);
      animation: drift-b calc(59s * var(--slow)) ease-in-out infinite alternate; }
.g3 { left: 15vmax; bottom: -55vmax; background: radial-gradient(circle, rgba(150,92,172,.38) 0%, transparent 62%);
      animation: drift-c calc(71s * var(--slow)) ease-in-out infinite alternate; }
.g4 { width: 50vmax; height: 50vmax; right: 5vmax; top: -25vmax; background: radial-gradient(circle, rgba(255,222,176,.28) 0%, transparent 65%);
      animation: drift-d calc(31s * var(--slow)) ease-in-out infinite alternate; }
@keyframes drift-a { to { transform: translate(60vmax, 45vmax) scale(1.2); } }
@keyframes drift-b { to { transform: translate(-55vmax, -50vmax) scale(1.3); } }
@keyframes drift-c { to { transform: translate(40vmax, -60vmax) scale(.85); } }
@keyframes drift-d { to { transform: translate(-45vmax, 55vmax) scale(1.35); } }
#splashText {
  position: relative; margin: 0; padding: 0 6vw; text-align: center; color: #fff;
  font-size: min(9vw, 14vh); font-weight: 300; letter-spacing: .02em; line-height: 1.15;
  text-shadow: 0 0 40px rgba(0, 0, 0, .35); animation: rise 2.4s ease-out both;
}
@keyframes rise { from { opacity: 0; transform: translateY(1.5vh); } }

#hint { position: fixed; bottom: 4vh; left: 0; right: 0; margin: 0; text-align: center; font-size: 1rem; color: #8a93a0; }
body.fs { cursor: none; }
body.fs #hint { display: none; }
</style>
</head>
<body data-state="" data-mode="splash">

<div id="splash" aria-hidden="true">
  <i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i><i class="glow g4"></i>
  <p id="splashText"></p>
</div>
<div id="clock">00:00</div>
<p id="hint">Click here to send the display to the extension screen</p>

<script>
const channel = new BroadcastChannel("countdown-timer");
const clock = document.getElementById("clock");
const hint = document.getElementById("hint");
const splashText = document.getElementById("splashText");
let state = { running: false, endAt: 0, remaining: 0, total: 0, splash: true, text: "" };

const pad = n => String(n).padStart(2, "0");
function fmt(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}
function draw() {
  document.body.dataset.mode = state.splash ? "splash" : "timer";
  const label = state.text || "";
  if (splashText.textContent !== label) splashText.textContent = label;
  if (state.splash) return;
  const ms = state.running ? Math.max(0, state.endAt - Date.now()) : state.remaining;
  const secs = Math.ceil(ms / 1000);
  const text = fmt(ms);
  clock.textContent = text;
  clock.classList.toggle("long", text.length > 5);
  document.body.dataset.state = state.total <= 0 ? "" : ms <= 0 ? "done" : secs <= 10 ? "danger" : secs <= 60 ? "warn" : "";
}

channel.onmessage = e => {
  if (e.data === "close-display") { window.close(); return; }
  if (e.data && typeof e.data === "object") { state = e.data; draw(); }
};
channel.postMessage("hello"); // ask the control page for the current state
setInterval(draw, 200);
draw();

// One click on the main screen sends this window, fullscreen, to the extension screen.
async function sendToExtension() {
  if (document.fullscreenElement) return;
  try {
    const details = await window.getScreenDetails();
    const target = details.screens.find(sc => sc !== details.currentScreen);
    if (!target) { hint.textContent = "No second screen found. Check the display settings, then click here."; return; }
    await document.documentElement.requestFullscreen({ screen: target });
  } catch (e) {
    hint.textContent = "Couldn't reach the extension screen. Allow window management for this site, then click here again.";
  }
}
document.addEventListener("click", sendToExtension);
document.addEventListener("fullscreenchange", () => {
  document.body.classList.toggle("fs", !!document.fullscreenElement);
});
</script>
</body>
</html>
