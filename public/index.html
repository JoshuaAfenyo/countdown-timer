<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown timer</title>
<style>
:root {
  --bg: #14181d; --panel: #1d232b; --line: #333c48; --text: #eef2f6; --muted: #9aa5b3;
  --accent: #3fc1b0; --warn: #ffb020; --danger: #ff5a52;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: center;
  background: var(--bg); color: var(--text); font-family: var(--font);
}
.card { width: min(480px, 100%); padding: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
h1 { margin: 0 0 8px; font-size: 1.1rem; font-weight: 600; color: var(--muted); }
p { margin: 0 0 16px; line-height: 1.5; }
button {
  width: 100%; padding: 14px; font: inherit; font-weight: 600; cursor: pointer;
  background: var(--accent); color: #06231f; border: 1px solid var(--accent); border-radius: 8px;
}
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.msg { min-height: 2.6em; margin: 14px 0 0; font-size: .9rem; color: var(--muted); }

/* The display is parked off-screen until it goes fullscreen on the extension screen. */
#display:not(:fullscreen) { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; overflow: hidden; }
#display { display: flex; align-items: center; justify-content: center; background: #000; color: #fff; cursor: none; }
#display[data-state="warn"] { color: var(--warn); }
#display[data-state="danger"], #display[data-state="done"] { color: var(--danger); }
#clock {
  font-size: min(30vw, 70vh); font-weight: 700; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
#display.long #clock { font-size: min(20vw, 60vh); }
#display[data-state="done"] #clock { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: .15; } }
@media (prefers-reduced-motion: reduce) { #display[data-state="done"] #clock { animation: none; } }
</style>
</head>
<body>

<main class="card">
  <h1>Countdown timer</h1>
  <p>One click opens the controls on this screen and sends the countdown to the extension screen. Press Esc to bring this window back.</p>
  <button id="show">Show on extension screen</button>
  <p id="msg" class="msg" role="status"></p>
</main>

<div id="display" data-state=""><div id="clock">00:00</div></div>

<script>
const $ = id => document.getElementById(id);
const channel = new BroadcastChannel("countdown-timer");
let state = { running: false, endAt: 0, remaining: 0, total: 0 }, controlsWin = null;

const pad = n => String(n).padStart(2, "0");
function fmt(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}
function draw() {
  const ms = state.running ? Math.max(0, state.endAt - Date.now()) : state.remaining;
  const secs = Math.ceil(ms / 1000);
  const text = fmt(ms);
  $("clock").textContent = text;
  $("display").classList.toggle("long", text.length > 5);
  $("display").dataset.state = state.total <= 0 ? "" : ms <= 0 ? "done" : secs <= 10 ? "danger" : secs <= 60 ? "warn" : "";
}

channel.onmessage = e => {
  if (e.data === "exit-fullscreen") { if (document.fullscreenElement) document.exitFullscreen(); return; }
  if (e.data && typeof e.data === "object") { state = e.data; draw(); }
};
channel.postMessage("hello"); // ask the controls for the current timer state
setInterval(draw, 200);
draw();

async function show() {
  const msg = $("msg");
  if (!("getScreenDetails" in window)) {
    msg.textContent = "This browser can't choose a screen. Use Chrome or Edge on the projection computer.";
    return;
  }
  let details;
  try { details = await window.getScreenDetails(); }
  catch (e) { msg.textContent = "Allow window management when the browser asks, then click the button again."; return; }
  const target = details.screens.find(sc => sc !== details.currentScreen);
  if (!target) { msg.textContent = "No second screen found. Check the display settings."; return; }

  // 1. Controls open in their own window on this screen.
  if (!controlsWin || controlsWin.closed) {
    const cur = details.currentScreen, w = 540, h = 720;
    const left = cur.availLeft + 20, top = cur.availTop + 20;
    controlsWin = window.open("controls.html", "countdown-controls",
      `popup=yes,left=${left},top=${top},width=${Math.min(w, cur.availWidth)},height=${Math.min(h, cur.availHeight)}`);
    if (!controlsWin) { msg.textContent = "The browser blocked the controls window. Allow pop-ups for this site, then click the button again."; return; }
  }
  // 2. This window goes fullscreen on the extension screen.
  try {
    await $("display").requestFullscreen({ screen: target });
    msg.textContent = "";
  } catch (e) {
    msg.textContent = "The controls are open. Click the button once more to send the countdown to the extension screen.";
  }
}
$("show").onclick = show;
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) $("msg").textContent = "";
});
</script>
</body>
</html>
