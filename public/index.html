<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown timer</title>
<style>
:root {
  --bg: #14181d; --panel: #1d232b; --line: #333c48; --text: #eef2f6; --muted: #9aa5b3;
  --accent: #3fc1b0; --warn: #ffb020; --danger: #ff5a52;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: center;
  background: var(--bg); color: var(--text); font-family: var(--font);
}
.card { width: min(480px, 100%); padding: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
h1 { margin: 0 0 8px; font-size: 1.1rem; font-weight: 600; color: var(--muted); }
.preview {
  font-size: clamp(3.5rem, 18vw, 5.5rem); font-weight: 700; line-height: 1.1;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin-bottom: 20px;
}
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
input {
  width: 100px; padding: 10px; font: inherit; font-size: 1.1rem; color: var(--text);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
input[type="text"] { width: 100%; }
label.grow { flex: 1; }
button {
  padding: 10px 16px; font: inherit; font-weight: 600; color: var(--text); cursor: pointer;
  background: transparent; border: 1px solid var(--line); border-radius: 8px;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: #06231f; min-width: 110px; }
button.wide { width: 100%; padding: 14px; border-color: var(--accent); color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.msg { min-height: 2.6em; margin: 4px 0 0; font-size: .9rem; color: var(--muted); }
.hint { margin: 0; font-size: .8rem; color: var(--muted); }
[data-state="warn"] { color: var(--warn); }
[data-state="danger"], [data-state="done"] { color: var(--danger); }
</style>
</head>
<body>

<main class="card">
  <h1>Countdown timer</h1>
  <div id="preview" class="preview" data-state="">05:00</div>

  <div class="row">
    <label>Minutes <input id="min" type="number" min="0" max="999" value="5" inputmode="numeric"></label>
    <label>Seconds <input id="sec" type="number" min="0" max="59" value="0" inputmode="numeric"></label>
  </div>

  <div class="row" id="presets">
    <button data-min="1">1 min</button>
    <button data-min="2">2 min</button>
    <button data-min="5">5 min</button>
    <button data-min="10">10 min</button>
    <button data-min="15">15 min</button>
    <button data-min="30">30 min</button>
  </div>

  <div class="row">
    <button id="toggle" class="primary">Start</button>
    <button id="reset">Reset</button>
    <button id="minus">−1 min</button>
    <button id="plus">+1 min</button>
  </div>

  <div class="row">
    <label class="grow">Splash text (optional)
      <input id="splashText" type="text" maxlength="60" placeholder="Welcome">
    </label>
  </div>
  <div class="row"><button id="splash">Show timer on display</button></div>

  <button id="show" class="wide">Show on extension screen</button>
  <p id="msg" class="msg" role="status"></p>
  <div class="row"><button id="closefs">Close display</button></div>
  <p class="hint">Space starts or pauses. R resets. Keep this window open while the display is showing.</p>
</main>

<script>
const $ = id => document.getElementById(id);
const channel = new BroadcastChannel("countdown-timer");
let total = 0, remaining = 0, endAt = 0, running = false, wake = null, displayWin = null, splash = true;

const pad = n => String(n).padStart(2, "0");
function fmt(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}

// Send the current timer state to the display window.
function broadcast() { channel.postMessage({ running, endAt, remaining, total, splash, text: $("splashText").value.trim() }); }
// A newly opened display asks for the current state.
channel.onmessage = e => { if (e.data === "hello") broadcast(); };

function readInputs() {
  const m = Math.max(0, parseInt($("min").value, 10) || 0);
  const s = Math.max(0, parseInt($("sec").value, 10) || 0);
  return (m * 60 + s) * 1000;
}
function setFromInputs() {
  total = remaining = readInputs();
  render(); broadcast();
}

function render() {
  const ms = running ? Math.max(0, endAt - Date.now()) : remaining;
  const secs = Math.ceil(ms / 1000);
  $("preview").textContent = fmt(ms);
  $("preview").dataset.state = total <= 0 ? "" : ms <= 0 ? "done" : secs <= 10 ? "danger" : secs <= 60 ? "warn" : "";
  $("toggle").textContent = running ? "Pause" : (remaining > 0 && remaining < total ? "Resume" : "Start");
  if (running && ms <= 0) finish();
}

function start() {
  if (running) return;
  if (remaining <= 0) setFromInputs();
  if (remaining <= 0) return;
  endAt = Date.now() + remaining; // count to a fixed end time so background throttling cannot cause drift
  running = true;
  splash = false; syncSplash(); // starting the timer switches the display to the timer
  lockScreen(); render(); broadcast();
}
function pause() {
  if (!running) return;
  remaining = Math.max(0, endAt - Date.now());
  running = false;
  unlockScreen(); render(); broadcast();
}
function finish() {
  running = false; remaining = 0;
  unlockScreen(); render(); broadcast();
}
function reset() {
  running = false;
  unlockScreen();
  setFromInputs();
}
function adjust(deltaMs) {
  if (running) endAt = Math.max(Date.now(), endAt + deltaMs);
  else remaining = Math.max(0, remaining + deltaMs);
  total = Math.max(total, running ? endAt - Date.now() : remaining);
  render(); broadcast();
}

async function lockScreen() {
  try { wake = await navigator.wakeLock?.request("screen"); } catch (e) {}
}
function unlockScreen() {
  if (wake) { wake.release().catch(() => {}); wake = null; }
}
document.addEventListener("visibilitychange", () => {
  if (running && document.visibilityState === "visible") lockScreen();
});

// Open the display in a small window on THIS screen. Click inside it once to send it to the extension screen.
// (A small, unmaximized window avoids the blank screen that a maximized window can cause.)
async function showOnExtension() {
  const msg = $("msg");
  if (!("getScreenDetails" in window)) {
    msg.textContent = "This browser can't choose a screen. Use Chrome or Edge on the projection computer.";
    return;
  }
  if (displayWin && !displayWin.closed) {
    displayWin.focus();
    msg.textContent = "The display is already open. Click inside it to send it to the extension screen.";
    return;
  }
  let cur;
  try { cur = (await window.getScreenDetails()).currentScreen; } // asks for permission the first time
  catch (e) { msg.textContent = "Allow window management when the browser asks, then click the button again."; return; }
  const w = Math.min(640, cur.availWidth), h = Math.min(360, cur.availHeight);
  const left = cur.availLeft + Math.round((cur.availWidth - w) / 2);
  const top = cur.availTop + Math.round((cur.availHeight - h) / 2);
  displayWin = window.open("display.html", "countdown-display", `popup=yes,left=${left},top=${top},width=${w},height=${h}`);
  msg.textContent = displayWin
    ? "The display opened on this screen. Click inside it to send it to the extension screen."
    : "The browser blocked the display window. If you just allowed window management, click the button again. Otherwise allow pop-ups for this site.";
}

$("toggle").onclick = () => (running ? pause() : start());
$("reset").onclick = reset;
$("minus").onclick = () => adjust(-60000);
$("plus").onclick = () => adjust(60000);
$("show").onclick = showOnExtension;
$("closefs").onclick = () => channel.postMessage("close-display");
$("presets").onclick = e => {
  const m = e.target.dataset.min;
  if (!m) return;
  $("min").value = m; $("sec").value = 0;
  reset();
};
["min", "sec"].forEach(id => $(id).addEventListener("input", () => { if (!running) setFromInputs(); }));
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); running ? pause() : start(); }
  if (e.key.toLowerCase() === "r") reset();
});

function syncSplash() { $("splash").textContent = splash ? "Show timer on display" : "Show splash on display"; }
$("splash").onclick = () => { splash = !splash; syncSplash(); broadcast(); };
try { $("splashText").value = localStorage.getItem("splashText") || ""; } catch (e) {}
$("splashText").addEventListener("input", () => {
  try { localStorage.setItem("splashText", $("splashText").value); } catch (e) {}
  broadcast();
});

setInterval(() => { if (running) render(); }, 200);
setFromInputs();
</script>
</body>
</html>
