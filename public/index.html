<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown timer</title>
<script>
// A phone opening this address belongs on the remote page. Add ?pc to the address to stay here.
if (matchMedia("(pointer: coarse) and (max-width: 700px)").matches && !location.search.includes("pc")) location.replace("/remote");
</script>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/preview.css">
<meta name="theme-color" content="#14181d">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root {
  --bg: #14181d; --panel: #1d232b; --line: #333c48; --text: #eef2f6; --muted: #9aa5b3;
  --accent: #3fc1b0; --warn: #ffb020; --danger: #ff5a52;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: center;
  background: var(--bg); color: var(--text); font-family: var(--font);
}
.card { width: min(900px, 100%); padding: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
h1 { margin: 0 0 8px; font-size: 1.1rem; font-weight: 600; color: var(--muted); }
.preview {
  font-size: clamp(3.5rem, 18vw, 5.5rem); font-weight: 700; line-height: 1.1;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin-bottom: 20px;
}
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
input {
  width: 100px; padding: 10px; font: inherit; font-size: 1.1rem; color: var(--text);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
input[type="text"], input[type="password"] { width: 100%; }
label.grow { flex: 1; }
button {
  padding: 10px 16px; font: inherit; font-weight: 600; color: var(--text); cursor: pointer;
  background: transparent; border: 1px solid var(--line); border-radius: 8px;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: #06231f; min-width: 110px; }
button.wide { width: 100%; padding: 14px; border-color: var(--accent); color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.msg { min-height: 2.6em; margin: 4px 0 0; font-size: .9rem; color: var(--muted); }
.hint { margin: 0; font-size: .8rem; color: var(--muted); }
[data-state="warn"] { color: var(--warn); }
[data-state="danger"], [data-state="done"] { color: var(--danger); }
button.linkbtn { min-height: 0; padding: 4px 10px; border: none; background: none; color: var(--muted); text-decoration: underline; font-weight: 400; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
.col { min-width: 0; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; gap: 0; } }
</style>
</head>
<body>

<main class="card">
  <h1>Countdown timer</h1>
  <div class="cols">
    <div class="col">
      <div id="preview" class="preview" data-state="">05:00</div>

      <div class="row">
        <label>Minutes <input id="min" type="number" min="0" max="999" value="5" inputmode="numeric"></label>
        <label>Seconds <input id="sec" type="number" min="0" max="59" value="0" inputmode="numeric"></label>
      </div>

      <div class="row" id="presets">
        <button data-min="1">1 min</button>
        <button data-min="2">2 min</button>
        <button data-min="5">5 min</button>
        <button data-min="10">10 min</button>
        <button data-min="15">15 min</button>
        <button data-min="30">30 min</button>
      </div>

      <div class="row">
        <button id="toggle" class="primary">Start</button>
        <button id="reset">Reset</button>
        <button id="minus">−1 min</button>
        <button id="plus">+1 min</button>
      </div>

      <div class="row">
        <label class="grow">Splash text (optional)
          <input id="splashText" type="text" maxlength="60" placeholder="Welcome">
        </label>
      </div>
      <div class="row"><button id="splash">Show timer on display</button></div>
    </div>

    <div class="col">
      <div class="pv-wrap"><div id="pv"></div></div>
      <p style="margin: -6px 0 14px"><button id="pvToggle" class="linkbtn">Hide preview</button></p>

      <button id="show" class="wide">Show on extension screen</button>
      <p id="displayStatus" class="hint" style="margin-top: 10px">Display: not open</p>
      <p id="msg" class="msg" role="status"></p>
      <div class="row"><button id="closefs">Close display</button></div>

      <div class="row">
        <label class="grow">Phone remote PIN
          <input id="remotePin" type="password" autocomplete="off" placeholder="PIN">
        </label>
        <button id="remoteConnect" style="align-self: flex-end">Connect</button>
      </div>
      <p id="remoteStatus" class="msg" role="status"></p>
      <p class="hint">Open this on the phone: <b id="remoteUrl"></b> <button id="copyUrl" class="linkbtn">Copy</button></p>
      <p class="hint">Space starts or pauses. R resets. Keep this window open while the display is showing.</p>
    </div>
  </div>
</main>

<script src="/preview.js"></script>
<script>
const $ = id => document.getElementById(id);
const channel = new BroadcastChannel("countdown-timer");
let total = 0, remaining = 0, endAt = 0, running = false, wake = null, displayWin = null, splash = true;

const pad = n => String(n).padStart(2, "0");
function fmt(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}

// Send the current timer state to the display window.
function broadcast() {
  channel.postMessage({ running, endAt, remaining, total, splash, text: $("splashText").value.trim() });
  updatePreview();
  pushRemote();
}
// A newly opened display asks for the current state.
let lastAlive = 0, displayFs = false, displayState = "closed";
channel.onmessage = e => {
  if (e.data === "hello") broadcast();
  else if (e.data && e.data.type === "alive") { lastAlive = Date.now(); displayFs = !!e.data.fs; checkDisplay(); }
  else if (e.data && e.data.type === "bye") { lastAlive = 0; checkDisplay(); } // the display window was closed
};
// The display window sends a heartbeat every 2 seconds. No heartbeat for 5 seconds means it is closed.
function checkDisplay() {
  const s = Date.now() - lastAlive > 5000 ? "closed" : displayFs ? "fullscreen" : "window";
  if (s === displayState) return;
  displayState = s;
  $("displayStatus").textContent = "Display: " + (s === "closed" ? "not open" : s === "window" ? "open, not on the extension screen yet" : "showing on the extension screen");
  pushRemote();
}
setInterval(checkDisplay, 2000);

function readInputs() {
  const m = Math.max(0, parseInt($("min").value, 10) || 0);
  const s = Math.max(0, parseInt($("sec").value, 10) || 0);
  return (m * 60 + s) * 1000;
}
function setFromInputs() {
  total = remaining = readInputs();
  render(); broadcast();
}

function render() {
  const ms = running ? Math.max(0, endAt - Date.now()) : remaining;
  const secs = Math.ceil(ms / 1000);
  $("preview").textContent = fmt(ms);
  updatePreview();
  $("preview").dataset.state = total <= 0 ? "" : ms <= 0 ? "done" : secs <= 10 ? "danger" : secs <= 60 ? "warn" : "";
  $("toggle").textContent = running ? "Pause" : (remaining > 0 && remaining < total ? "Resume" : "Start");
  if (running && ms <= 0) finish();
}

function start() {
  if (running) return;
  if (remaining <= 0) setFromInputs();
  if (remaining <= 0) return;
  endAt = Date.now() + remaining; // count to a fixed end time so background throttling cannot cause drift
  running = true;
  splash = false; syncSplash(); // starting the timer switches the display to the timer
  lockScreen(); render(); broadcast();
}
function pause() {
  if (!running) return;
  remaining = Math.max(0, endAt - Date.now());
  running = false;
  unlockScreen(); render(); broadcast();
}
function finish() {
  running = false; remaining = 0;
  unlockScreen(); render(); broadcast();
}
function reset() {
  running = false;
  unlockScreen();
  setFromInputs();
}
function adjust(deltaMs) {
  if (running) endAt = Math.max(Date.now(), endAt + deltaMs);
  else remaining = Math.max(0, remaining + deltaMs);
  total = Math.max(total, running ? endAt - Date.now() : remaining);
  render(); broadcast();
}

async function lockScreen() {
  try { wake = await navigator.wakeLock?.request("screen"); } catch (e) {}
}
function unlockScreen() {
  if (wake) { wake.release().catch(() => {}); wake = null; }
}
document.addEventListener("visibilitychange", () => {
  if (running && document.visibilityState === "visible") lockScreen();
});

// Open the display in a small window on THIS screen. Click inside it once to send it to the extension screen.
// (A small, unmaximized window avoids the blank screen that a maximized window can cause.)
async function showOnExtension() {
  const msg = $("msg");
  if (!("getScreenDetails" in window)) {
    msg.textContent = "This browser can't choose a screen. Use Chrome or Edge on the projection computer.";
    return;
  }
  if (displayWin && !displayWin.closed) {
    displayWin.focus();
    msg.textContent = "The display is already open. Click inside it to send it to the extension screen.";
    return;
  }
  let cur;
  try { cur = (await window.getScreenDetails()).currentScreen; } // asks for permission the first time
  catch (e) { msg.textContent = "Allow window management when the browser asks, then click the button again."; return; }
  const w = Math.min(640, cur.availWidth), h = Math.min(360, cur.availHeight);
  const left = cur.availLeft + Math.round((cur.availWidth - w) / 2);
  const top = cur.availTop + Math.round((cur.availHeight - h) / 2);
  displayWin = window.open("/display", "countdown-display", `popup=yes,left=${left},top=${top},width=${w},height=${h}`);
  msg.textContent = displayWin
    ? "The display opened on this screen. Click inside it to send it to the extension screen."
    : "The browser blocked the display window. If you just allowed window management, click the button again. Otherwise allow pop-ups for this site.";
}

$("toggle").onclick = () => (running ? pause() : start());
$("reset").onclick = reset;
$("minus").onclick = () => adjust(-60000);
$("plus").onclick = () => adjust(60000);
$("show").onclick = showOnExtension;
$("closefs").onclick = () => channel.postMessage("close-display");
$("presets").onclick = e => {
  const m = e.target.dataset.min;
  if (!m) return;
  $("min").value = m; $("sec").value = 0;
  reset();
};
["min", "sec"].forEach(id => $(id).addEventListener("input", () => { if (!running) setFromInputs(); }));
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); running ? pause() : start(); }
  if (e.key.toLowerCase() === "r") reset();
});

function syncSplash() { $("splash").textContent = splash ? "Show timer on display" : "Show splash on display"; }
$("splash").onclick = () => { splash = !splash; syncSplash(); broadcast(); };
try { $("splashText").value = localStorage.getItem("splashText") || ""; } catch (e) {}
$("splashText").addEventListener("input", () => {
  try { localStorage.setItem("splashText", $("splashText").value); } catch (e) {}
  broadcast();
});

// ---- Preview of what the display shows ----
function updatePreview() {
  Preview.update({ splash, text: $("splashText").value.trim(), ms: running ? Math.max(0, endAt - Date.now()) : remaining, total });
}
$("remoteUrl").textContent = location.origin + "/remote";
$("copyUrl").onclick = () => {
  navigator.clipboard?.writeText(location.origin + "/remote").then(() => { $("copyUrl").textContent = "Copied"; }, () => {});
};
Preview.mount($("pv"));
let previewOn = true;
try { previewOn = localStorage.getItem("previewOn") !== "0"; } catch (e) {}
function syncPreviewToggle() {
  Preview.setOn(previewOn);
  $("pvToggle").textContent = previewOn ? "Hide preview" : "Show preview";
  updatePreview();
}
$("pvToggle").onclick = () => {
  previewOn = !previewOn;
  try { localStorage.setItem("previewOn", previewOn ? "1" : "0"); } catch (e) {}
  syncPreviewToggle();
};
syncPreviewToggle();

// ---- Phone remote: connects to the relay when there is internet; the timer works the same without it ----
let ws = null, remoteReady = false, remoteDenied = false, remoteReplaced = false, wsBackoff = 1000;
let wsTimer, connectTimer, pingTimer, pongTimer;
const setRemoteStatus = text => { $("remoteStatus").textContent = text; };

function pushRemote() {
  if (!ws || ws.readyState !== 1 || !remoteReady) return;
  ws.send(JSON.stringify({
    type: "state", running, total, splash, display: displayState, text: $("splashText").value.trim(),
    remaining: running ? Math.max(0, endAt - Date.now()) : remaining // time left now, so the phone's clock doesn't matter
  }));
}

function handleCmd(m) {
  switch (m.cmd) {
    case "toggle": running ? pause() : start(); break;
    case "reset": reset(); break;
    case "adjust": { const d = Number(m.delta); if (Math.abs(d) <= 600000) adjust(d); break; }
    case "preset": { const n = parseInt(m.minutes, 10); if (n >= 1 && n <= 999) { $("min").value = n; $("sec").value = 0; reset(); } break; }
    case "splash": splash = !!m.on; syncSplash(); broadcast(); break;
    case "text":
      $("splashText").value = String(m.text || "").slice(0, 60);
      try { localStorage.setItem("splashText", $("splashText").value); } catch (e) {}
      broadcast(); break;
  }
}

function clearRemoteTimers() { clearTimeout(connectTimer); clearInterval(pingTimer); clearTimeout(pongTimer); }
function scheduleRemote() {
  clearTimeout(wsTimer);
  wsTimer = setTimeout(connectRemote, wsBackoff);
  wsBackoff = Math.min(wsBackoff * 2, 30000);
}
function connectRemote() {
  let pin = "";
  try { pin = localStorage.getItem("remotePin") || ""; } catch (e) {}
  if (!pin) { setRemoteStatus("Enter a PIN to turn on the phone remote."); return; }
  if (!navigator.onLine) { setRemoteStatus("Phone remote: no internet. Use this page directly."); scheduleRemote(); return; }
  if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} }
  clearRemoteTimers();
  remoteReady = false;
  setRemoteStatus("Phone remote: connecting…");
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  connectTimer = setTimeout(() => { try { ws.close(); } catch (e) {} }, 8000);
  ws.onopen = () => {
    clearTimeout(connectTimer);
    ws.send(JSON.stringify({ type: "auth", role: "controller", pin }));
    pingTimer = setInterval(() => {
      if (ws.readyState !== 1) return;
      ws.send("ping");
      clearTimeout(pongTimer);
      pongTimer = setTimeout(() => ws.close(), 10000);
    }, 25000);
  };
  ws.onmessage = ev => {
    if (ev.data === "pong") { clearTimeout(pongTimer); return; }
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === "ready") { remoteReady = true; wsBackoff = 1000; setRemoteStatus("Phone remote: connected."); broadcast(); }
    else if (m.type === "hello") broadcast(); // a phone just connected
    else if (m.type === "cmd") handleCmd(m);
    else if (m.type === "denied") {
      remoteDenied = true;
      setRemoteStatus(m.reason === "locked" ? "Too many wrong PINs. Wait a minute, then click Connect."
        : m.reason === "unconfigured" ? "The remote isn't set up on the server yet (no PIN secret)." : "Wrong PIN.");
    }
  };
  ws.onclose = e => {
    clearRemoteTimers();
    remoteReady = false;
    if (remoteDenied) return;
    if (e.code === 4000) { remoteReplaced = true; setRemoteStatus("Phone remote: another control page took over."); return; }
    setRemoteStatus("Phone remote: offline. Retrying…");
    scheduleRemote();
  };
}
try { $("remotePin").value = localStorage.getItem("remotePin") || ""; } catch (e) {}
$("remoteConnect").onclick = () => {
  const pin = $("remotePin").value.trim();
  if (!pin) { setRemoteStatus("Enter a PIN first."); return; }
  try { localStorage.setItem("remotePin", pin); } catch (e) {}
  remoteDenied = false; remoteReplaced = false; wsBackoff = 1000;
  connectRemote();
};
window.addEventListener("online", () => { if (!remoteDenied && !remoteReplaced) { wsBackoff = 1000; connectRemote(); } });
window.addEventListener("offline", () => setRemoteStatus("Phone remote: no internet. Use this page directly."));
connectRemote();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

setInterval(() => { if (running) render(); }, 200);
setFromInputs();
</script>
</body>
</html>
